[package]
name = "karaoke-core"
description = "Pipeline stages, ONNX inference, and format I/O for the karaoke app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ort.workspace = true
ndarray.workspace = true
hound.workspace = true
symphonia.workspace = true
rubato.workspace = true
flacenc.workspace = true
serde.workspace = true
serde_json.workspace = true
rustfft.workspace = true
sha2.workspace = true
rusqlite.workspace = true
lofty.workspace = true
cpal.workspace = true
ureq.workspace = true
# Key/tempo shift: vendored Signalsmith Stretch (MIT) via hand-written FFI
# (docs/DEPENDENCIES.md; never Rubber Band).
karaoke-stretch-sys = { path = "../karaoke-stretch-sys" }

[target.'cfg(windows)'.dependencies]
# The GPU path (DirectML.dll ships beside the exe; docs/DEPENDENCIES.md).
ort = { workspace = true, features = ["directml"] }

[dev-dependencies]
# Integration tests fabricate tiny tagged fixtures at test time (no
# copyrighted audio in the repo — CLAUDE.md hard rule) and poke DB pragmas
# the store API doesn't expose.
rusqlite.workspace = true
lofty.workspace = true
hound.workspace = true
