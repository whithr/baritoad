# CI. Windows and macOS are the platforms we ship: tests and a build on every
# push, plus the party relay and cargo deny. Linux doesn't ship yet, so its
# build check lives in platforms.yml and runs only when started by hand.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pushes to main queue behind a running CI instead of cancelling it, so every
# commit there gets a real result; a pull request's newer push still replaces
# its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI never debugs its builds: skipping debug info cuts compile and link
  # time, which is most of the Windows job.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  windows:
    name: Windows — tests + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Save the compiled dependencies even when a test fails, so the next run
      # doesn't start from nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Webview — install, test, type-check, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Rust tests
        run: cargo test --locked --no-fail-fast -p karaoke-core -p karaoke-desktop
      - name: CLI builds
        run: cargo build --locked -p karaoke-cli

  macos:
    name: macOS — tests + build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Webview — install, test, type-check, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Rust tests
        run: cargo test --locked --no-fail-fast -p karaoke-core -p karaoke-desktop
      - name: CLI builds
        run: cargo build --locked -p karaoke-cli

  relay:
    name: Party relay — typecheck, tests, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/relay/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/relay/pnpm-lock.yaml
      - name: Typecheck, test, build the guest page, dry-run the Worker bundle
        working-directory: services/relay
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec wrangler deploy --dry-run --outdir dist

  deny:
    name: cargo deny (docs/DEPENDENCIES.md)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
