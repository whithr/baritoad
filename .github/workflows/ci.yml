# CI (PLAN.md §9, v1.0 item 4). Windows is the v1.0 platform: tests and a
# build on every push. Linux builds on every push too; macOS builds when run
# by hand or for a tag — its runner minutes cost ten times as much on a
# private repo. Neither ships yet (PLAN.md §3, Windows first).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows — tests + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Webview — install, test, type-check, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Rust tests
        run: cargo test --locked -p karaoke-core -p karaoke-desktop
      - name: CLI builds
        run: cargo build --locked -p karaoke-cli

  linux:
    name: Linux — build only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri's WebKitGTK stack, ALSA, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Webview build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build
        run: cargo build --locked -p karaoke-desktop -p karaoke-cli

  macos:
    name: macOS — build only
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Webview build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build
        run: cargo build --locked -p karaoke-desktop -p karaoke-cli

  relay:
    name: Party relay — typecheck, tests, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/relay/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/relay/pnpm-lock.yaml
      - name: Typecheck, test, build the guest page, dry-run the Worker bundle
        working-directory: services/relay
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec wrangler deploy --dry-run --outdir dist

  deny:
    name: cargo deny (PLAN.md §6)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
