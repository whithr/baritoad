[package]
name = "lyric-render-spike"
version = "0.1.0"
edition = "2021"

# Standalone spike crate — not part of any workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
