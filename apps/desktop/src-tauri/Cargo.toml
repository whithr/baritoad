[package]
name = "karaoke-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Desktop app shell (Tauri) for the karaoke pipeline — source-available, local-only processing"

# Wraps karaoke-core directly (no CLI subprocess). PLAN.md §5: Tauri webview
# UI over the Rust core; PLAN.md §9 Phase 2 milestone 1.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karaoke-core = { path = "../../../crates/karaoke-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
