[package]
name = "karaoke-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Desktop app shell (Tauri) for the karaoke pipeline — local-only processing"

# Wraps karaoke-core directly (no CLI subprocess). PLAN.md §5: Tauri webview
# UI over the Rust core; PLAN.md §9 Phase 2 milestone 1.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karaoke-core = { path = "../../../crates/karaoke-core" }
# protocol-asset: review-screen audio playback via the asset protocol — the
# scope starts EMPTY (tauri.conf.json) and files are allowed one at a time at
# runtime (src/review.rs playback_sources), never whole directories of the
# user's disk.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Media keys + the OS "now playing" panel (PLAN.md §3, §6 row): SMTC on
# Windows; zbus (pure Rust) rather than libdbus for the later Linux build.
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
serde = { workspace = true }
serde_json = { workspace = true }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
qrcodegen = "1.8.0"
