<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#008080" />
    <title>baritoad party</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Pixel Operator";
        src: url("/fonts/pixel-operator-regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Pixel Operator";
        src: url("/fonts/pixel-operator-bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }
      :root {
        --face: #c0c0c0;
        --hi: #ffffff;
        --lo: #808080;
        --dk: #000000;
        --navy: #000080;
        --navy2: #1084d0;
        --ink: #000000;
        --muted: #404040;
        --sel: #000080;
        --desk: #008080;
        --field: #ffffff;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--desk);
        color: var(--ink);
        font: 16px/1.25 "Pixel Operator", Tahoma, "Segoe UI", sans-serif;
        -webkit-font-smoothing: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
      }
      .win {
        max-width: 480px;
        margin: 0 auto;
        background: var(--face);
        box-shadow: inset -1px -1px var(--dk), inset 1px 1px #dfdfdf, inset -2px -2px var(--lo), inset 2px 2px var(--hi);
        padding: 3px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 6px;
        background: linear-gradient(90deg, var(--navy), var(--navy2));
        color: #fff;
        font-weight: 700;
      }
      .bar svg {
        flex-shrink: 0;
      }
      .body {
        padding: 12px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 24px;
        line-height: 28px;
        margin: 0;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .field {
        width: 100%;
        height: 36px;
        padding: 4px 8px;
        font: inherit;
        font-size: 18px;
        background: var(--field);
        border: 0;
        border-radius: 0;
        box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px #dfdfdf;
        outline: none;
      }
      .field:focus-visible {
        outline: 1px dotted var(--dk);
        outline-offset: -5px;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--face);
        border: 0;
        border-radius: 0;
        min-height: 40px;
        padding: 6px 14px;
        box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px #dfdfdf;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:active:not(:disabled),
      button[aria-pressed="true"],
      button[aria-checked="true"] {
        box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px #dfdfdf;
      }
      button:disabled {
        color: var(--lo);
        text-shadow: 1px 1px var(--hi);
        cursor: default;
      }
      button.primary {
        font-weight: 700;
        outline: 1px solid var(--dk);
        outline-offset: -1px;
      }
      button:focus-visible {
        outline: 1px dotted var(--dk);
        outline-offset: -5px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .end {
        justify-content: flex-end;
      }
      .preview {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: var(--desk);
        box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi);
      }
      .tag {
        background: #fff;
        padding: 2px 8px;
        font-weight: 700;
        box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi);
      }
      .picker {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 6px;
      }
      .picker button {
        min-height: 52px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .swatch {
        width: 28px;
        height: 28px;
        box-shadow: inset 1px 1px var(--dk);
      }
      .sunken {
        background: var(--field);
        box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px #dfdfdf;
        padding: 2px;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 52vh;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        min-height: 44px;
        border-bottom: 1px dotted #c0c0c0;
      }
      .list li.pick {
        cursor: pointer;
      }
      .list li.pick:active,
      .list li.on {
        background: var(--sel);
        color: #fff;
      }
      .list li.on .muted {
        color: #c0c0ff;
      }
      .list .grow {
        flex: 1;
        min-width: 0;
      }
      .list .t {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list .a {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .chips button {
        min-height: 34px;
        white-space: nowrap;
        padding: 4px 10px;
      }
      .big {
        font-size: 48px;
        line-height: 52px;
        font-weight: 700;
      }
      .note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px;
        background: #ffffe1;
        box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi);
      }
      .num {
        width: 24px;
        text-align: right;
        flex-shrink: 0;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: no-preference) {
        .list {
          scroll-behavior: smooth;
        }
      }
    </style>
  </head>
  <body>
    <main class="win" aria-live="polite">
      <div class="bar"><span id="bar-toad"></span><span>baritoad party</span></div>
      <div class="body" id="app"><p>Connecting…</p></div>
    </main>
    <noscript><p style="color: #fff; text-align: center">baritoad's party page needs JavaScript.</p></noscript>
    <script src="/guest.js"></script>
  </body>
</html>
