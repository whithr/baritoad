[workspace]
resolver = "2"
members = [
    "crates/karaoke-core",
    "crates/karaoke-cli",
    "crates/karaoke-stretch-sys",
    "apps/desktop/src-tauri",
]
# Phase 0 spike crates keep their own lockfiles/targets and stay out of the
# workspace (spikes/README.md: spike code is frozen evidence, not product code).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Pinned to the version the separation spike validated (spikes/separation/REPORT.md:
# ort 2.0.0-rc.13 / ONNX Runtime 1.28.0). Bump deliberately, re-running the
# golden parity check when you do.
ort = { version = "=2.0.0-rc.13", features = ["directml"] }
ndarray = "0.17"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }
rubato = "0.16"
flacenc = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
rustfft = "6"
# Library store (PLAN.md §5): SQLite via rusqlite; `bundled` compiles SQLite
# into the binary (public domain) so there is no system dependency.
rusqlite = { version = "0.37", features = ["bundled"] }
# Tag reading (title/artist/cover) at import time — local files only, no
# network metadata (PLAN.md §2 local-first).
lofty = "0.22"
# Playback audio engine (PLAN.md §5 "audio engine (cpal)"). Pinned to the
# 0.15 line the stretch spike validated on WASAPI (spikes/stretch/REPORT.md).
cpal = "0.15"

[profile.release]
opt-level = 3
