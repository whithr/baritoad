[workspace]
resolver = "2"
members = [
    "crates/karaoke-core",
    "crates/karaoke-cli",
    "crates/karaoke-stretch-sys",
    "apps/desktop/src-tauri",
]
# Phase 0 spike crates keep their own lockfiles/targets and stay out of the
# workspace (spikes/README.md: spike code is frozen evidence, not product code).
exclude = ["spikes"]

[workspace.package]
version = "1.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Pinned to the version the separation spike validated (spikes/separation/REPORT.md:
# ort 2.0.0-rc.13 / ONNX Runtime 1.28.0). Bump deliberately, re-running the
# golden parity check when you do.
# DirectML is Windows-only: karaoke-core turns the feature on for Windows
# targets (its Cargo.toml), so macOS and Linux build with the CPU provider.
ort = { version = "=2.0.0-rc.13" }
ndarray = "0.17"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "flac", "ogg", "vorbis", "wav", "aiff", "pcm"] }
rubato = "0.16"
flacenc = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
# HTTP for LRCLIB lyrics lookup and cover art (Add from URL): the system TLS
# stack and root store (SChannel / Security.framework / system OpenSSL), no
# rustls/ring. Same crate and features ort-sys already uses at build time.
# ("native-tls-no-default" would skip the unused webpki CA list, but ureq
# 3.3 gates its native-tls transport on the full feature.)
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
rustfft = "6"
# Library store: SQLite via rusqlite; `bundled` compiles SQLite
# into the binary (public domain) so there is no system dependency.
rusqlite = { version = "0.37", features = ["bundled"] }
# Tag reading (title/artist/cover) at import time — local files only, no
# network metadata (local-first).
lofty = "0.22"
# Playback audio engine (cpal). Pinned to the
# 0.15 line the stretch spike validated on WASAPI (spikes/stretch/REPORT.md).
cpal = "0.15"

[profile.release]
opt-level = 3

# Dev builds must keep audio DSP usable: unoptimized rubato made the player's
# 44.1k -> 48k sinc resample take ~98 s for a 3-minute song (measured via
# karaoke-core examples/loadprobe on the RTX 2080 box, device at 48 kHz),
# which blocked player_load — the full-screen player sat with a null status
# and every control inert. Optimizing external deps only keeps workspace
# crates fast to rebuild and debuggable.
[profile.dev.package."*"]
opt-level = 2

# karaoke-core's own hot loops (separation overlap-add, stem writes, the CTC
# trellis) ran unoptimized in the debug desktop build: a 5:57 import spent
# 175 s of a 260 s separate stage outside model inference, and the trellis
# took 5.3 s vs 0.18 s in release (job manifests, 2026-09-30, RTX 2080 box).
[profile.dev.package.karaoke-core]
opt-level = 2
# Incremental + optimized broke links three times on 2026-10-02: after edits,
# reused codegen units referenced `anon.*.llvm.*` symbols the recompiled ones
# no longer had (LNK2019 in libkaraoke_core, fixed only by `cargo clean -p
# karaoke-core`). Without incremental each edit rebuilds the crate whole.
incremental = false

# The stretch engine's C++ (Signalsmith via cc) and its Rust glue run inside
# the real-time audio callback — keep them optimized in dev too (cc compiles
# with the profile's opt level).
[profile.dev.package.karaoke-stretch-sys]
opt-level = 3
